# Verification only. This workflow never pushes an image — publishing lives in
# docker.yml and is driven exclusively by `v*` tags. Keep it that way: listening
# on both a branch and its tag double-runs every build.
name: CI

on:
  push:
    branches: [main]
    # Tags are docker.yml's job. Without this, tagging a commit on main would
    # run both workflows over the same tree.
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the runtime base image in the Dockerfile. SQLAlchemy only
          # declares its greenlet dependency below 3.13, so testing on the
          # version we actually ship matters.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    # No point building the image if the code it wraps is broken.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64 only, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single platform on purpose: this is a "does the Dockerfile still
          # work" check, and emulating arm64 under QEMU here would cost minutes
          # for no extra signal. docker.yml builds the real multi-arch image.
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon so the next step can actually run it.
          load: true
          tags: tally:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not running. Three of this project's real bugs — a
      # naive-vs-aware datetime crash among them — got through a green build and
      # were only found by starting the container. This costs about twenty
      # seconds and covers the entire class: import errors, migrations that
      # raise on an empty database, and a broken entrypoint.
      - name: Start it and check it answers
        run: |
          docker run -d --name tally-ci \
            -e SECRET_KEY=ci-smoke-test-key \
            -e DATA_DIR=/data \
            -p 8080:8080 \
            tally:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json; then
              echo "Healthy after ${attempt}s:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          echo "::error::The container never answered /api/health"
          docker logs tally-ci
          exit 1

      - name: Container logs must be free of tracebacks
        run: |
          if docker logs tally-ci 2>&1 | grep -q "Traceback (most recent call last)"; then
            echo "::error::The container logged a traceback during startup"
            docker logs tally-ci
            exit 1
          fi
          echo "No tracebacks logged."

      - name: Stop it
        if: always()
        run: docker rm -f tally-ci || true
