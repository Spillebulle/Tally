<!doctype html>
<!--
  `class="web"` is the hosted-web scale (STYLE-GUIDE.md 6.5). Tally is read
  in a browser tab rather than at arm's length in a desktop tool, so
  `tokens.css` swaps one table of sizes for another: 52px top bar, 32px
  buttons and fields, 38px nav rows, 14px body, and the artwork ladder one
  rung up. It is a scale and nothing else - same colours, same hairlines,
  same shadows, same rules about the accent - and it is stamped here, once,
  because a component may never read it.

  It is written into the markup rather than added by a script: it is not a
  preference, it never changes, and anything that stamped it at runtime
  would render one frame at desktop size first. The theme script below
  removes only `dark` and `light`, and so does ThemeProvider.
-->
<html lang="en" class="web">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Tally is a self-hosted watch tracker. Films, series and anime, in two-way sync with Plex." />
    <meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E4E0D9" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Tally</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      //
      // Three built-in states: dark is the 'dark' class, forced light is
      // 'light', and following the system stamps nothing at all, so
      // prefers-color-scheme decides. ThemeProvider does exactly the same
      // thing; the two have to agree or the first paint shows the other theme.
      //
      // A custom theme is the fourth choice and cannot be resolved this early:
      // it is a per-user server preference and its colours are a fetch, and
      // nothing may block first paint on a round trip. But its *lightness* is
      // the only part that can flash - the colours arriving a moment later
      // change no lightness - so ThemeProvider mirrors that one bit into
      // localStorage whenever the theme changes, and it is read here.
      //
      // The mirror is a hint and never authority. It is written only once the
      // theme's base is confirmed, and ThemeProvider drops it the moment the
      // server says this account has no custom theme, or no longer has this
      // one. So a stale entry costs at most one round trip of the wrong
      // shadows and cannot strand the app in the wrong lightness.
      (function () {
        try {
          var root = document.documentElement
          root.classList.remove('dark', 'light')
          var custom = localStorage.getItem('tally.theme.id')
          if (custom) {
            // A theme is dark because its base is. Anything but 'light' reads
            // as dark, which is the format's own fallback for a base it does
            // not know.
            root.classList.add(localStorage.getItem('tally.theme.base') === 'light' ? 'light' : 'dark')
            return
          }
          var stored = localStorage.getItem('tally.theme') || 'dark'
          // 'system' stamps nothing, so prefers-color-scheme decides.
          if (stored === 'dark' || stored === 'light') root.classList.add(stored)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
