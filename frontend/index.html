<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Tally — track every film, series and anime you watch, in sync with Plex." />
    <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Tally</title>
    <script>
      // Apply the stored theme before first paint so there is no light flash.
      (function () {
        try {
          var stored = localStorage.getItem('tally.theme') || 'dark'
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
