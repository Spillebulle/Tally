[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# No blanket `ignore::DeprecationWarning`. Both pytest-asyncio and SQLAlchemy
# announce removals that way, so silencing the category wholesale hides exactly
# the warning that tells you the next upgrade will break. The suite currently
# raises none; if a dependency starts being noisy, silence that specific
# message rather than the category.
filterwarnings =
    default::DeprecationWarning
